<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>APU Karting</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
  }

  .container, .slide table {
    width: 100%;
  }

  .carousel {
    position: relative;
    width: 100%;
    overflow: hidden;
  }

  .carousel-track {
    display: flex;
    transition: transform 0.5s;
  }

  .slide {
    min-width: 100%;
  }

  .carousel button {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    font-size: 24px;
    padding: 10px 15px;
    cursor: pointer;
    z-index: 2;
  }

  #prevBtn { left: 10px; }
  #nextBtn { right: 10px; }
</style>
</head>
<body>

<div class="container">
  <div class="carousel">
    <div class="carousel-track">

      <div class="slide">
        hi
      </div>

      <div class="slide">
        hi
      </div>

      <!-- Slide 3 -->
      <div class="slide">
        hi
      </div>

    </div>

    <button id="prevBtn">&#10094;</button>
    <button id="nextBtn">&#10095;</button>
  </div>
</div>

































<script>
  const track = document.querySelector(".carousel-track");
  const slides = document.querySelectorAll(".slide");
  let current = 0;

  function updatePosition() {
    track.style.transform = "translateX(-" + (current * 100) + "%)";
  }

  document.getElementById("nextBtn").addEventListener("click", function() {
    current = current + 1;
    if (current >= slides.length) {
      current = 0;
    }
    updatePosition();
  });

  document.getElementById("prevBtn").addEventListener("click", function() {
    current = current - 1;
    if (current < 0) {
      current = slides.length - 1;
    }
    updatePosition();
  });
</script>

</body>
</html>
