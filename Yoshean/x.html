<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>APU Karting</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
  }

  .container {
    width: 100%;
  }

  .carousel {
    position: relative;
    width: 100%;
    overflow: hidden;
  }

  .carousel-track {
    display: flex;
    transition: transform 0.5s;
  }

  .slide {
    min-width: 100%;
  }

  .slide table {
    width: 100%;
  }

  .slide td {
    vertical-align: middle;
    padding: 20px;
  }

  .slide h1 span {
    color: red;
  }

  .btn {
    display: inline-block;
    background: red;
    color: white;
    padding: 10px 20px;
    margin-right: 10px;
    text-decoration: none;
    border-radius: 5px;
  }

  .carousel button {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    font-size: 24px;
    padding: 10px 15px;
    cursor: pointer;
    z-index: 2;
  }

  #prevBtn { left: 10px; }
  #nextBtn { right: 10px; }
</style>
</head>
<body>

<div class="container">
  <div class="carousel">
    <div class="carousel-track">

      <!-- Slide 1 -->
      <div class="slide">
        <table>
          <tr>
            <td>
              <h1>Meet The <span>Crew</span></h1>
              <p>Student-run karting at APU, real seat time, real circuits, no experience required.</p>
              <br>
              <a href="../Yoshean/committee.html" class="btn">Meet the Crew</a>
              <a href="../Aavaneesh/membership.html" class="btn">Join Us</a>
            </td>
            <td><img src="../Images/friends.png" height="300"></td>
          </tr>
        </table>
      </div>

      <!-- Slide 2 -->
      <div class="slide">
        <table>
          <tr>
            <td>
              <h1>Next <span>Race Day</span></h1>
              <p>Join us for our upcoming race event, open to all members.</p>
              <br>
              <a href="#" class="btn">View Details</a>
            </td>
            <td><img src="../Images/race1.jpg" height="300"></td>
          </tr>
        </table>
      </div>

      <!-- Slide 3 -->
      <div class="slide">
        <table>
          <tr>
            <td>
              <h1>Our <span>Sponsors</span></h1>
              <p>Thanks to our sponsors for supporting APU Karting.</p>
              <br>
              <a href="#" class="btn">Meet Sponsors</a>
            </td>
            <td><img src="../Images/race2.jpg" height="300"></td>
          </tr>
        </table>
      </div>

    </div>

    <button id="prevBtn">&#10094;</button>
    <button id="nextBtn">&#10095;</button>
  </div>
</div>

<script>
  const track = document.querySelector(".carousel-track");
  const slides = document.querySelectorAll(".slide");
  let current = 0;

  function updatePosition() {
    track.style.transform = "translateX(-" + (current * 100) + "%)";
  }

  document.getElementById("nextBtn").addEventListener("click", function() {
    current = current + 1;
    if (current >= slides.length) {
      current = 0;
    }
    updatePosition();
  });

  document.getElementById("prevBtn").addEventListener("click", function() {
    current = current - 1;
    if (current < 0) {
      current = slides.length - 1;
    }
    updatePosition();
  });
</script>

</body>
</html>
